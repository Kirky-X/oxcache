[workspace]
members = [".", "macros"]

[package]
name = "oxcache"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "A high-performance, production-ready Rust multi-level cache library providing L1 (Moka) and L2 (Redis) caching."
license = "MIT"
repository = "https://github.com/Kirky-X/oxcache"
homepage = "https://github.com/Kirky-X/oxcache"
documentation = "https://docs.rs/oxcache"
keywords = ["cache", "redis", "moka", "distributed-cache", "two-level-cache"]
categories = ["caching"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["macros"]

# ============================================================================
# CORE DEPENDENCIES (Always Required)
# ============================================================================
[dependencies]
# Async runtime - essential for all async operations
tokio = { version = "1.42", default-features = false, features = ["sync", "rt", "macros", "time"] }

# Error handling - fundamental for all error propagation
thiserror = "1.0"

# Async trait pattern - enables trait object async methods
async-trait = "0.1"

# UUID generation - used for request tracing and cache keys
uuid = { version = "1.0", default-features = false, features = ["v4"] }

# Lazy static initialization - for global state
lazy_static = "1.4"

# Hashing - fast and secure hash functions for cache keys
ahash = { version = "0.8.12", default-features = false, features = ["std"] }

# Secret management - for sensitive configuration
secrecy = { version = "0.10.3", default-features = false, features = ["serde"] }

# Configuration parsing
toml = { version = "0.8", optional = true }

# Tracing for logging and instrumentation
tracing = { version = "0.1", optional = true }

# ============================================================================
# L1 CACHE DEPENDENCIES (Memory Cache)
# ============================================================================
[dependencies.moka]
version = "0.12"
default-features = false
features = ["future"]
optional = true

# In-memory concurrent map for internal state
[dependencies.dashmap]
version = "6.0"
optional = true

# ============================================================================
# L2 CACHE DEPENDENCIES (Redis Distributed Cache)
# ============================================================================
[dependencies.redis]
version = "0.27"
default-features = false
features = ["aio", "tokio-comp", "cluster-async", "sentinel", "connection-manager", "script"]
optional = true

# ============================================================================
# SERIALIZATION & COMPRESSION
# ============================================================================
[dependencies.serde]
version = "1.0"
default-features = false
features = ["derive", "alloc"]

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.flate2]
version = "1.0"
optional = true

[dependencies.bincode]
version = "2.0"
optional = true

# ============================================================================
# DATABASE DEPENDENCIES
# ============================================================================
[dependencies.sea-orm]
version = "1.0.14"
default-features = false
optional = true

[dependencies.sqlx]
version = "0.8"
default-features = false
optional = true

# ============================================================================
# OBSERVABILITY & METRICS
# ============================================================================

[dependencies.opentelemetry]
version = "0.22"
optional = true

[dependencies.opentelemetry_sdk]
version = "0.22"
optional = true

[dependencies.tracing-opentelemetry]
version = "0.23"
optional = true

[dependencies.opentelemetry-otlp]
version = "0.15"
optional = true

[dependencies.tracing-subscriber]
version = "0.3"
default-features = false
optional = true

# ============================================================================
# UTILITIES
# ============================================================================
[dependencies.tokio-util]
version = "0.7"
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[dependencies.regex]
version = "1.10"
optional = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["serde", "clock"]
optional = true

# ============================================================================
# ADVANCED FEATURES
# ============================================================================
# Bloom filter for cache optimization
[dependencies.bloomfilter]
version = "2.0.0"
optional = true

# Rate limiting
[dependencies.governor]
version = "0.6"
default-features = false
features = ["std"]
optional = true

# WAL (Write-Ahead Log) persistence
[dependencies.crc32fast]
version = "1.3"
optional = true

# Memory profiling support
[dependencies.jemalloc-ctl]
version = "0.5"
optional = true

# Murmur3 hash for bloom filters
[dependencies.murmur3]
version = "0.5"
optional = true

# ============================================================================
# CLI & CONFIGURATION
# ============================================================================
[dependencies.clap]
version = "4.4"
default-features = false
features = ["derive"]
optional = true

[dependencies.confers]
version = "0.1.1"
optional = true

# ============================================================================
# MCP & INTEGRATION
# ============================================================================
[dependencies.mcp-sdk-rs]
version = "0.3.4"
optional = true

# ============================================================================
# DEV DEPENDENCIES
# ============================================================================
[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"
rand = "0.8"
criterion = { version = "0.5", features = ["async_tokio"] }
ctor = "0.2"
mockall = "0.14.0"

# ============================================================================
# BUILD DEPENDENCIES
# ============================================================================
[build-dependencies]
anyhow = { version = "1.0", optional = true }

[dependencies.anyhow]
version = "1.0"

# ============================================================================
# FEATURE DEFINITIONS
# ============================================================================

[features]

# Default: Full feature set for maximum compatibility
default = ["full"]

# --------------------------------------------------------------------
# TIERED FEATURES (Build on top of individual features)
# --------------------------------------------------------------------

# Minimal: Only L1 memory cache - no Redis, no external services
minimal = [
    "l1-moka",
    "tokio/time",
    "tracing",
    "metrics",
    "serialization",
    "chrono",
]

# Core: L1 + L2 Redis + metrics - production-ready basic setup
core = [
    "minimal",
    "l2-redis",
]

# Full: All features enabled
full = [
    "core",
    "bloom-filter",
    "rate-limiting",
    "batch-write",
    "wal-recovery",
    "serialization",
    "compression",
    "database",
    "cli",
    "opentelemetry",
    "full-metrics",
    "config-toml",
]

# --------------------------------------------------------------------
# INDIVIDUAL OPTIONAL FEATURES (Zero-cost abstractions)
# --------------------------------------------------------------------

# L1 Cache Layer
l1-moka = ["moka", "dep:dashmap", "serialization", "tracing", "chrono"]

# L2 Cache Layer
l2-redis = ["dep:redis"]

# Observability
metrics = ["tracing"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-otlp",
]

# Advanced Cache Features
bloom-filter = ["dep:bloomfilter", "murmur3"]
rate-limiting = ["governor"]
batch-write = ["tokio-util", "futures"]

# Persistence & Recovery
wal-recovery = ["crc32fast"]

# Data Format Support
serialization = ["serde_json", "bincode"]
compression = ["flate2"]

# Database Integration
database = ["sea-orm", "sqlx", "chrono"]

# CLI Tools
cli = ["clap", "confers"]

# Configuration
config-toml = ["toml"]

# Advanced Utilities
regex = ["dep:regex"]
full-metrics = ["opentelemetry", "dep:tracing-subscriber"]
mcp-integration = ["dep:mcp-sdk-rs"]

# Sync writer module (internal module)
sync = []

# Utils module (internal module)
utils = []

# Development & Testing
test-helpers = []

# Memory profiling (requires jemalloc allocator)
memory-profiling = ["jemalloc-ctl"]

# Enable internal module access for testing
test = []

# Build configuration
codegen = ["anyhow"]

# --------------------------------------------------------------------
# PROFILE CONFIGURATIONS
# --------------------------------------------------------------------

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true

[profile.test]
opt-level = 0

# ============================================================================
# BENCHMARKS
# ============================================================================

[[bench]]
name = "cache_benchmark"
harness = false

# ============================================================================
# TESTS
# ============================================================================

[[test]]
name = "invalidation_test"
path = "tests/integration/invalidation_test.rs"

[[test]]
name = "single_flight_test"
path = "tests/integration/single_flight_test.rs"

[[test]]
name = "wal_test"
path = "tests/integration/wal_test.rs"

[[test]]
name = "redis_test"
path = "tests/integration/redis_test.rs"

[[test]]
name = "manual_control_test"
path = "tests/integration/manual_control_test.rs"

[[test]]
name = "layer_test"
path = "tests/layer_test.rs"

[[test]]
name = "lifecycle_test"
path = "tests/integration/lifecycle_test.rs"

[[test]]
name = "security_test"
path = "tests/integration/security_test.rs"

[[test]]
name = "version_test"
path = "tests/integration/version_test.rs"

[[test]]
name = "chaos_test"
path = "tests/integration/chaos_test.rs"

[[test]]
name = "lock_warmup_test"
path = "tests/integration/lock_warmup_test.rs"

[[test]]
name = "database_partitioning_tests"
path = "tests/database_partitioning_tests.rs"

[[test]]
name = "sea_orm_sqlite_tests"
path = "tests/integration/sea_orm_sqlite_tests.rs"

[[test]]
name = "sqlite_partition_tests"
path = "tests/integration/sqlite_partition_tests.rs"

[[test]]
name = "degradation_tests"
path = "tests/integration/degradation_tests.rs"

[[test]]
name = "serialization_test"
path = "tests/unit/serialization_test.rs"
