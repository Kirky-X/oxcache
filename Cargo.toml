[package]
name = "oxcache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A production-grade multi-level cache library for Rust: L1 memory (Moka/DashMap) + L2 distributed (Redis/Valkey/Dragonfly/Aerospike) + optional L3 disk (redb)."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["cache", "redis", "memory", "async", "performance"]
categories = ["caching", "asynchronous", "database"]

[package.metadata.docs.rs]
features = ["full"]

[lints]
workspace = true

[lib]
name = "oxcache"
path = "src/lib.rs"

[workspace]
resolver = "2"
members = [".", "macros", "examples"]

[workspace.package]
version = "0.5.0-rc.11"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
repository = "https://github.com/Kirky-X/oxcache"
homepage = "https://github.com/Kirky-X/oxcache"
documentation = "https://docs.rs/oxcache"

[workspace.dependencies]
tokio = { version = "1.54", default-features = false }
async-trait = { version = "0.1", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "async_tokio"] }

[workspace.lints.rust]
# docsrs 是 docs.rs 构建注入的自定义 cfg（doc(cfg(...)) 标注用）
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
oxcache_macros = { version = "0.5.0-rc.11", path = "macros", default-features = false, optional = true }
# 包级不启用 rt-multi-thread（wasm32 仅支持 sync/macros/io-util/rt/time）；block_in_place 由 memory 启用
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
async-trait = { version = "0.1", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["std"] }
uuid = { version = "1.29", default-features = false, features = ["std", "v4"] }
# trait-kit 集成：包装 CacheBackend，单开须隐含 memory 基线
trait-kit = { version = "0.5.0-rc.10", default-features = false, features = ["async", "lifecycle", "health", "observer", "shutdown", "decorator"], optional = true }
# futures executor for sync health check in async context (trait-kit feature only)
futures = { version = "0.3", default-features = false, features = ["executor"], optional = true }
# ICU4X 常开：关闭 default 只留 compiled_data，裁掉未用的解析/迭代面
icu = { version = "2.4", default-features = false, features = ["compiled_data"] }
writeable = { version = "0.6", default-features = false, features = ["alloc"] }
# Fluent internationalization message catalog (always enabled)
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
# atomic64：无 64 位原子操作的目标（wasm32）需要 moka 的替代实现
moka = { version = "0.12", default-features = false, features = ["future", "atomic64"], optional = true }
dashmap = { version = "6.2", default-features = false, optional = true }
# redb 嵌入式键值存储（磁盘 L3 后端）；default 仅 std，显式声明同面关闭默认
redb = { version = "4.4", default-features = false, features = ["std"], optional = true }
# Redis L2：裁 script/sentinel 与 default 面（Lua 走显式 EVAL）
redis = { version = "1.8", default-features = false, features = ["aio", "tokio-comp", "connection-manager", "cluster-async"], optional = true }
# Aerospike：仅 TCP 直连，裁 tls/dynamic-config/serialization
aerospike = { version = "3.0", default-features = false, features = ["async", "rt-tokio"], optional = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["unbounded_depth"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
serde_stacker = { version = "0.1", default-features = false, optional = true }
bloomfilter = { version = "3.0", default-features = false, features = ["random"], optional = true }
# Lua 注入防护模式含非 ASCII 空白（如 U+00A0），须保留 unicode 面（关闭后 \s 退化为 ASCII 匹配，绕过防护）
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"], optional = true }
tracing = { version = "0.1", default-features = false, optional = true }
# 值级加密（XChaCha20-Poly1305）：nonce 由顶层 getrandom::fill 生成，无需 aead 的 getrandom 特性
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
# 值完整性（HMAC-SHA256，与 confers 审计链对齐）
hmac = { version = "0.13", default-features = false, optional = true }
# oid（DER 编码，PKI 场景）缓存完整性签名不需要
sha2 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
# bincode 钉 2.x：3.0.0 是 compile_error 占位，项目已停止开发
bincode = { version = "2.0", default-features = false, features = ["std", "serde"], optional = true }
postcard = { version = "1.1", default-features = false, features = ["use-std"], optional = true }
# 配置驱动构建（confers watch 热重载）
confers = { version = "0.6.0-rc.12", default-features = false, features = ["config-bus"], optional = true }
# 自适应压缩：只用 stream encode/decode，裁 legacy（旧格式解码）/arrays/zdict_builder（字典训练）
zstd = { version = "0.14", default-features = false, optional = true }

# wasm32 目标：uuid v4 需要显式随机源（js 特性仅对 wasm 生效，避免非 wasm 拉入 wasm-bindgen）
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.29", default-features = false, features = ["js", "v4", "std"] }

[dev-dependencies]
# 测试实现 EventPublisher（#[async_trait] trait）所需，与主依赖版本一致
async-trait = { version = "0.1", default-features = false }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
serial_test = { version = "4.0", default-features = false, features = ["async"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
criterion = { workspace = true }
ctor = { version = "1.0", default-features = false, features = ["std", "proc_macro", "priority"] }
trybuild = { version = "1.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
# 序列化格式对照探针（serialization_rkyv_probe）专用，非承诺特性
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
testcontainers = { version = "0.28", default-features = false }

# watchdog：信号退出时回收 managed 容器；裁 default（本地 socket 无需 TLS）。
# Windows 上 signal-hook 0.4 编译失败且无 POSIX 信号，仅 unix 启用。
[target.'cfg(unix)'.dev-dependencies]
testcontainers = { version = "0.28", default-features = false, features = ["watchdog"] }

[features]
default = ["minimal"]
minimal = ["memory", "metrics", "serialization", "dep:chrono"]
# 正名：core 实为 minimal+redis 两级基线，名字反映网络层的存在
redis-tier = ["minimal", "redis"]
# 兼容别名：旧 feature 名 core 转发到 redis-tier
core = ["redis-tier"]
# 真全量：全部具名能力 feature（弃用别名 core/red-lock/testing/kit 不入列，用正名）
full = ["redis-tier", "macros", "byte-weight", "compression", "batch", "lua", "test-util", "dragonfly", "aerospike", "lock", "redlock", "offload", "disk", "stale", "bloom", "trait-kit", "telemetry", "invalidation", "pubsub", "encrypt", "integrity", "serde-bincode", "postcard", "config-confers", "degradation", "audit", "versioning", "hotkey", "adaptive-ttl", "warmup"]

# memory/redis 隐含 serialization（Cache<K,V> 与 UnifiedSerializer 的核心依赖）
memory = ["dep:moka", "dep:dashmap", "dep:serde", "serialization", "tokio/rt-multi-thread"]
# 字节权重同步缓存（tokio-free 直连 moka::sync；moka 默认仅启用 future，需显式加 sync）
byte-weight = ["dep:moka", "moka/sync"]
# redis backend 的 sync 桥接用 block_in_place：该 API 门在 tokio/rt-multi-thread
# （feature-matrix 实测单独 --features redis 时 E0425），随 feature 显式拉入
redis = ["dep:redis", "dep:regex", "serialization", "tokio/rt-multi-thread"]
dragonfly = ["redis"]
aerospike = ["dep:aerospike"]
macros = ["dep:oxcache_macros", "minimal", "dep:sha2"]
serialization = ["dep:serde", "dep:serde_json", "dep:serde_stacker"]
metrics = ["serialization", "dep:chrono", "dep:dashmap"]
# BatchWriter 缓冲写（包装 Arc<dyn CacheBackend>，引用 crate::backend），单开须隐含 memory 基线（与 degradation 同口径）
batch = ["memory"]
lua = ["redis"]
test-util = []
# 已弃用别名：改用 `test-util`
testing = ["test-util"]
bloom = ["dep:bloomfilter"]
trait-kit = ["dep:trait-kit", "dep:futures", "memory"]
# 已弃用别名：改用 `trait-kit`
kit = ["trait-kit"]
lock = ["redis"]
redlock = ["lock"]
# 已弃用别名：改用 `redlock`
red-lock = ["redlock"]
# CompressingBackend 装饰任意 CacheBackend（引用 crate::backend 与 crate::infra 序列化面），单开须隐含 memory 基线（与 degradation 同口径）
compression = ["dep:flate2", "dep:zstd", "memory"]
telemetry = ["dep:tracing"]
# Offload 后台任务子系统（去重 / 并发上限 / 超时策略）
offload = ["dep:dashmap"]
# redb 嵌入式磁盘持久化 L3 后端（memory 为模块门控基线）
disk = ["memory", "serialization", "dep:redb"]
# SWR 三态过期（依赖 offload 做后台重验证）
stale = ["memory", "offload", "serialization"]
invalidation = ["redis", "serialization", "dep:futures"]
pubsub = ["redis", "dep:futures", "dep:tracing"]
# encrypt：加密/完整性装饰器，单开须隐含 memory；integrity 寄生 encryption
encrypt = ["dep:chacha20poly1305", "dep:getrandom", "memory"]
integrity = ["encrypt", "serialization", "dep:hmac", "dep:sha2"]
serde-bincode = ["serialization", "dep:bincode"]
postcard = ["serialization", "dep:postcard"]
config-confers = ["dep:confers", "serialization", "memory", "dep:futures"]
# degradation 装饰 L2 后端（模块引用 crate::backend，backend 门控 any(memory,redis,disk)），单开须隐含最小 backend 基线方可编译
degradation = ["memory"]
audit = []
versioning = []

# 热 key 采样观测
hotkey = ["dep:dashmap"]
# adaptive-ttl：hot 延长 / cold 缩短装饰器，默认关闭，须隐含 memory
adaptive-ttl = ["dep:dashmap", "memory"]

# warmup：WarmupLoader 异步回填 ChainCache，默认关闭，须隐含 memory
warmup = ["memory"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

[[bench]]
name = "modern_api_benchmark"
harness = false
required-features = ["minimal"]

[[bench]]
name = "hot_path_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "redis_benchmark"
harness = false
required-features = ["redis"]

[[bench]]
name = "serialization_benchmark"
harness = false
required-features = ["serialization"]

[[bench]]
name = "serialization_rkyv_probe"
harness = false
required-features = ["serialization"]

[[bench]]
name = "metrics_recorder_benchmark"
harness = false
# bench 走 `oxcache::Cache` 热路径（memory 面），单开 metrics 不满足
required-features = ["metrics", "memory"]

[[bench]]
name = "sync_surface_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "dashmap_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "dragonfly_benchmark"
harness = false
required-features = ["dragonfly"]
