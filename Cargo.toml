[package]
name = "oxcache"
version = "0.2.0"
edition = "2021"
description = "A high-performance multi-level cache library for Rust with L1 (memory) and L2 (Redis) caching."
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/kirky-x/oxcache"
readme = "README.md"
keywords = ["cache", "redis", "memory", "async", "performance"]
categories = ["caching", "asynchronous", "database"]

[lib]
name = "oxcache"
path = "src/lib.rs"

# ============================================================================
# MAIN DEPENDENCIES
# ============================================================================
[dependencies]
# Internal macros
oxcache_macros = { path = "macros", version = "0.2.0", optional = true }

# Async Runtime
tokio = { version = "1.49", features = ["full"] }
async-trait = "0.1"
lazy_static = "1.5"
once_cell = "1.21"

# Utilities
uuid = { version = "1.20", features = ["v4"] }
secrecy = { version = "0.10", features = ["serde"] }
rand = "0.8"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"

# Configuration
toml = { version = "0.8", optional = true }

# Tracing for logging and instrumentation
tracing = { version = "0.1", optional = true }

# HTTP support for http-cache feature
[dependencies.http]
version = "1.4"
optional = true

[dependencies.tower]
version = "0.5"
optional = true

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.hyper]
version = "1.8"
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

# ============================================================================
# L1 CACHE DEPENDENCIES (Memory Cache)
# ============================================================================
[dependencies.moka]
version = "0.12"
default-features = false
features = ["future"]
optional = true

# In-memory concurrent map for internal state
[dependencies.dashmap]
version = "6.1"
optional = true

# ============================================================================
# L2 CACHE DEPENDENCIES (Redis Distributed Cache)
# ============================================================================
[dependencies.redis]
version = "1.0"
default-features = false
features = ["aio", "tokio-comp", "cluster-async", "sentinel", "connection-manager", "script"]
optional = true

# ============================================================================
# SERIALIZATION & COMPRESSION
# ============================================================================
[dependencies.serde]
version = "1.0"
default-features = false
features = ["derive", "alloc"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.flate2]
version = "1.1"
optional = true

[dependencies.bincode]
version = "1.3"
optional = true

# Extra serialization (MessagePack, CBOR)
[dependencies.rmp-serde]
version = "1.3"
optional = true

[dependencies.ciborium]
version = "0.2"
optional = true

[dependencies.md5]
version = "0.7"
optional = true

[dependencies.base64]
version = "0.22"
optional = false

[dependencies.sha2]
version = "0.10"
optional = true

# ============================================================================
# DATABASE DEPENDENCIES
# ============================================================================
[dependencies.sea-orm]
version = "1.1.19"
default-features = false
features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"]
optional = true

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate"]
optional = true

# ============================================================================
# OBSERVABILITY & METRICS
# ============================================================================

[dependencies.opentelemetry]
version = "0.31"
optional = true

[dependencies.opentelemetry_sdk]
version = "0.31"
optional = true

[dependencies.tracing-opentelemetry]
version = "0.32"
optional = true

[dependencies.opentelemetry-otlp]
version = "0.31"
optional = true

[dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = ["env-filter", "fmt"]
optional = true

# ============================================================================
# UTILITIES
# ============================================================================
[dependencies.tokio-util]
version = "0.7"
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[dependencies.arc-swap]
version = "1.6"

[dependencies.regex]
version = "1.12"
optional = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["serde", "clock"]
optional = true

# ============================================================================
# ADVANCED FEATURES
# ============================================================================
# Bloom filter for cache optimization
[dependencies.bloomfilter]
version = "2.0.0"
optional = true

# Murmur3 hash for bloom filters
[dependencies.murmur3]
version = "0.5"
optional = true

# ============================================================================
# CONFIGURATION
# ============================================================================

[dependencies.confers]
path = "/home/dev/projects/confers"
optional = true
features = ["toml", "json", "env", "validation", "schema"]

[dependencies.garde]
version = "0.22"
features = ["derive"]
optional = true

[dependencies.clap]
version = "4.5"
default-features = false
features = ["std", "derive", "env", "cargo"]
optional = true

# ============================================================================
# DEV DEPENDENCIES
# ============================================================================
[dev-dependencies]
tempfile = "3.24"
serial_test = "3.3"
rand = "0.8"
criterion = { version = "0.5", features = ["async_tokio"] }
ctor = "0.2"
mockall = "0.14.0"

# ============================================================================
# BUILD DEPENDENCIES
# ============================================================================
[build-dependencies]
anyhow = { version = "1.0", optional = true }


# ============================================================================
# FEATURE DEFINITIONS
# ============================================================================

[features]

# Default: Full feature set for maximum compatibility
default = ["full"]

# --------------------------------------------------------------------
# TIERED FEATURES (Build on top of individual features)
# --------------------------------------------------------------------

# Minimal: Only L1 memory cache - no Redis, no external services
minimal = [
    "moka",
    "tokio/time",
    "tracing",
    "metrics",
    "serialization",
    "dep:chrono",
]

# Core: L1 + L2 basic functionality (Redis)
core = [
    "minimal",
    "redis",
    "futures",
]

# Full: All features enabled
full = [
    "core",
    "macros",
    "bloom-filter",
    "rate-limiting",
    "wal-recovery",
    "database",
    "sqlite",
    "dashmap",
    "dep:moka",
    "dep:redis",
    "dep:tracing",
    "cli",
    "full-metrics",
    "batch-write",
    "dep:confers",
    "codegen",
    "compression",
    "smart-strategy",
    "redis-native",
    "enhanced-stats",
    "ttl-control",
    "tiered-cache",
    "extra-serialization",
    "config-dynamic",
    "http-cache",
    "serialization-cache",
    "lua-script",
]

# --------------------------------------------------------------------
# COMPONENT FEATURES
# --------------------------------------------------------------------

# Cache Macros
macros = ["dep:oxcache_macros"]

# L1 Cache Implementation (Moka)
moka = ["dep:moka", "dep:dashmap"]

# DashMap Backend (Pure in-memory concurrent cache)
dashmap-backend = ["dep:dashmap"]

# L2 Cache Implementation (Redis)
redis = ["dep:redis"]

# Tracing support
tracing = ["dep:tracing"]

# SHA-256 hashing support
sha2 = ["dep:sha2"]

# Serialization Support
serialization = ["dep:serde", "dep:serde_json"]
bincode = ["serialization", "dep:bincode"]
compression = ["dep:flate2"]
flate2 = ["dep:flate2"]

# Serialization Cache
serialization-cache = ["serialization", "dep:dashmap"]

# Metrics & Observability
chrono = ["dep:chrono"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:chrono",
    "dep:tracing",
]
metrics = ["opentelemetry", "dep:dashmap", "dep:tracing"]
full-metrics = ["metrics", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]

# Database Integration
database = ["dep:sea-orm", "dep:sqlx", "dep:regex"]
sqlite = ["sqlx/sqlite"]
dashmap = ["dep:dashmap"]

# Advanced Features
bloom-filter = ["dep:bloomfilter", "dep:murmur3"]
rate-limiting = []
wal-recovery = ["database", "redis"]
batch-write = ["dep:tokio-util"]
sync = []

# Configuration
confers = [
    "dep:confers",
    "dep:garde",
    "confers/toml",
    "confers/json",
    "confers/env",
    "confers/validation",
    "confers/schema"
]

# Smart Strategy Features
smart-strategy = ["compression", "metrics", "moka"]
redis-native = ["redis"]
enhanced-stats = ["metrics"]
ttl-control = ["redis"]
tiered-cache = ["moka", "redis"]
extra-serialization = ["dep:rmp-serde", "dep:ciborium"]
config-dynamic = ["dep:confers", "dep:garde", "toml", "confers/validation", "confers/schema"]
http-cache = ["serialization", "tiered-cache", "dep:md5", "dep:sha2", "dep:http", "dep:tower", "dep:axum", "dep:hyper", "dep:http-body-util"]

# Lua Script Execution
lua-script = ["redis"]

cli = ["dep:clap", "dep:dashmap", "dep:tracing", "metrics"]
codegen = ["dep:anyhow"] # Used for build scripts

# ============================================================================
# COMPILER OPTIMIZATIONS
# ============================================================================
# These optimizations are always applied regardless of features
[profile.release]
opt-level = 3
lto = "fat"              # Enable Link-Time Optimization for better dead code elimination
codegen-units = 1        # Single codegen unit for better optimization
panic = "abort"          # Smaller binary by removing panic unwinding
strip = true             # Remove debug symbols
overflow-checks = false  # Disable overflow checks in release

# Optimize all dependencies equally
[profile.release.package."*"]
opt-level = 3

# Dev profile optimizations
[profile.dev]
debug = true

[profile.test]
opt-level = 0

# ============================================================================
# BENCHMARKS
# ============================================================================
[[bench]]
name = "modern_api_benchmark"
harness = false

[[bench]]
name = "optimization_benchmark"
harness = false

[[bench]]
name = "redis_benchmark"
harness = false

# ============================================================================
# TEST DEPENDENCIES
# ============================================================================
[dev-dependencies.testcontainers]
version = "0.23"

[dev-dependencies.testcontainers-modules]
version = "0.11"
features = ["redis", "postgres"]
