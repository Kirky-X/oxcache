[package]
name = "oxcache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A high-performance multi-level cache library for Rust with L1 (memory) and L2 (Redis) caching."
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cache", "redis", "memory", "async", "performance"]
categories = ["caching", "asynchronous", "database"]

[lints]
workspace = true

[lib]
name = "oxcache"
path = "src/lib.rs"

# ============================================================================
# WORKSPACE
# ============================================================================
[workspace]
resolver = "2"
members = [".", "macros", "examples"]

[workspace.package]
version = "0.5.0-rc.4"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/oxcache"

[workspace.dependencies]
tokio = { version = "1.53", default-features = false }
async-trait = "0.1"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
chrono = { version = "0.4", default-features = false }
criterion = { version = "0.8", features = ["async_tokio"] }

[workspace.lints.rust]
unexpected_cfgs = "allow"

[workspace.lints.clippy]

# ============================================================================
# DEPENDENCIES
# ============================================================================
[dependencies]
# Internal macros
oxcache_macros = { path = "macros", version = "0.5.0-rc.4", optional = true }

# Async Runtime
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "bytes",
] }
async-trait = "0.1"
once_cell = "1.21"

# Utilities
uuid = { version = "1.24", features = ["v4"] }

# Error Handling
[dependencies.anyhow]
version = "1.0"
optional = true

# trait-kit integration (optional, feature-gated via `kit`)
[dependencies.trait-kit]
version = "0.5.0-rc.3"
features = ["async", "lifecycle", "health", "observer", "shutdown", "decorator"]
optional = true
default-features = false

# futures executor for sync health check in async context (kit feature only)
[dependencies.futures]
version = "0.3"
optional = true
default-features = false
features = ["executor"]

# ICU4X internationalization (always enabled)
[dependencies.icu]
version = "2.3"

[dependencies.writeable]
version = "0.6"

# L1 Cache (Memory)
[dependencies.moka]
version = "0.12"
default-features = false
features = ["future"]
optional = true

[dependencies.dashmap]
version = "6.2"
optional = true

# L2 Cache (Redis)
[dependencies.redis]
version = "1.5"
default-features = false
features = ["aio", "tokio-comp", "connection-manager", "cluster-async", "sentinel"]
optional = true

# Aerospike (independent protocol, feature-gated)
[dependencies.aerospike]
version = "2.2"
optional = true

# Serialization & Compression
[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0"
features = ["unbounded_depth"]
optional = true

[dependencies.flate2]
version = "1.1"
optional = true

[dependencies.serde_stacker]
version = "0.1"
optional = true

# Observability & Metrics
[dependencies.bloomfilter]
version = "3.0"
optional = true

[dependencies.regex]
version = "1.13"
optional = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["serde", "clock"]
optional = true

# Telemetry (optional tracing facade)
[dependencies.tracing]
version = "0.1"
default-features = false
optional = true

# Value-level encryption (optional, XChaCha20-Poly1305, aligned with confers)
[dependencies.chacha20poly1305]
version = "0.11"
optional = true

[dependencies.getrandom]
version = "0.4"
optional = true

# Value integrity (optional, HMAC-SHA256, aligned with confers audit chain)
[dependencies.hmac]
version = "0.13"
optional = true

[dependencies.sha2]
version = "0.11"
optional = true

# Binary serialization formats (optional, T305)
[dependencies.bincode]
version = "1.3"
optional = true

[dependencies.postcard]
version = "1.1"
default-features = false
features = ["use-std"]
optional = true

# Config-driven build (optional, confers watch hot-reload, T307)
[dependencies.confers]
version = "0.6.0-rc.3"
default-features = false
features = ["config-bus"]
optional = true

# Adaptive compression (optional, zstd threshold decorator, T310)
[dependencies.zstd]
version = "0.13"
optional = true

# ============================================================================
# DEV DEPENDENCIES
# ============================================================================
[dev-dependencies]
# 测试实现 EventPublisher（#[async_trait] trait）所需，与主依赖版本一致
async-trait = "0.1"
tempfile = "3.27"
serial_test = "4.0"
rand = "0.10"
criterion = { version = "0.8", features = ["async_tokio"] }
ctor = "1.0"
trybuild = "1.0"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies.testcontainers]
version = "0.28"

# ============================================================================
# FEATURES
# ============================================================================
[features]
# Default: Minimal (L1 memory cache only)
default = ["minimal"]

# Tiered presets
minimal = [
    "memory",
    "tokio/time",
    "metrics",
    "serialization",
    "dep:chrono",
]
core = ["minimal", "redis"]
full = [
    "core",
    "macros",
    "compression",
    "batch",
    "lua",
    "testing",
    "dragonfly",
    "aerospike",
    "lock",
]

# Component features
memory = ["dep:moka", "dep:dashmap", "dep:serde"]
redis = ["dep:redis", "dep:regex"]
dragonfly = ["redis"]
aerospike = ["dep:aerospike"]
macros = ["dep:oxcache_macros", "minimal"]
serialization = ["dep:serde", "dep:serde_json", "dep:serde_stacker"]
metrics = ["serialization", "dep:chrono", "dep:dashmap"]
batch = []
lua = ["redis"]
testing = []
bloom = ["dep:bloomfilter"]
kit = ["dep:trait-kit", "dep:futures"]
lock = ["redis"]
red-lock = ["lock"]
compression = ["dep:flate2", "dep:zstd"]
telemetry = ["dep:tracing"]
invalidation = ["redis", "serialization", "dep:futures"]
encrypt = ["dep:chacha20poly1305", "dep:getrandom"]
integrity = ["dep:hmac", "dep:sha2"]
serde-bincode = ["serialization", "dep:bincode"]
postcard = ["serialization", "dep:postcard"]
config-confers = ["dep:confers", "serialization", "memory", "dep:futures"]
degradation = []
audit = []
versioning = []

# ============================================================================
# PROFILES
# ============================================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# ============================================================================
# BENCHMARKS
# ============================================================================
[[bench]]
name = "modern_api_benchmark"
harness = false

[[bench]]
name = "hot_path_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "redis_benchmark"
harness = false
required-features = ["redis"]

[[bench]]
name = "serialization_benchmark"
harness = false
required-features = ["serialization"]

[[bench]]
name = "dashmap_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "dragonfly_benchmark"
harness = false
required-features = ["dragonfly"]

# ============================================================================
# PATCH (local dev dependencies for rc cycle)
# ============================================================================
[patch.crates-io]
trait-kit = { path = "../trait-kit" }
confers = { path = "../confers" }
