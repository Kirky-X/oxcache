[package]
name = "oxcache"
version = "0.2.0"
edition = "2021"
description = "A high-performance multi-level cache library for Rust with L1 (memory) and L2 (Redis) caching."
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/kirky-x/oxcache"
readme = "README.md"
keywords = ["cache", "redis", "memory", "async", "performance"]
categories = ["caching", "asynchronous", "database"]

[lib]
name = "oxcache"
path = "src/lib.rs"

# ============================================================================
# MAIN DEPENDENCIES
# ============================================================================
[dependencies]
# Internal macros
oxcache_macros = { path = "macros", version = "0.2.0", optional = true }

# Async Runtime - 精简特性
tokio = { version = "~1.52", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "bytes",
] }
async-trait = "0.1"
lazy_static = "1.5"
once_cell = "1.21"

# Utilities
uuid = { version = "~1.22", features = ["v4"] }
secrecy = { version = "~0.10", features = ["serde"] }
rand = "0.10"

# Error Handling
thiserror = "2.0"
glob-match = { version = "0.2.1", optional = true }
[dependencies.anyhow]
version = "~1.0"
optional = true

# Tracing for logging and instrumentation
[dependencies.tracing]
version = "~0.1"
optional = true

# Configuration
[dependencies.toml]
version = "~0.8"
optional = true

# HTTP support for http-cache feature
[dependencies.http]
version = "~1.4"
optional = true

[dependencies.tower]
version = "~0.5"
optional = true

[dependencies.axum]
version = "~0.8"
optional = true

[dependencies.hyper]
version = "~1.9"
optional = true

[dependencies.http-body-util]
version = "~0.1"
optional = true

# ============================================================================
# L1 CACHE DEPENDENCIES (Memory Cache)
# ============================================================================
[dependencies.moka]
version = "0.12"
default-features = false
features = ["future"]
optional = true

# In-memory concurrent map for internal state
[dependencies.dashmap]
version = "6.1"
optional = true

# ============================================================================
# L2 Cache Dependencies (Redis) - 精简特性
[dependencies.redis]
version = "~1.2"
default-features = false
features = ["aio", "tokio-comp", "connection-manager", "cluster-async", "sentinel"]
optional = true

# ============================================================================
# Serialization & Compression - 精简特性
[dependencies.serde]
version = "~1.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "~1.0"
optional = true

[dependencies.flate2]
version = "1.1"
optional = true

[dependencies.bincode]
version = "3.0.0-rc.5"
package = "bincode-next"
optional = true

# Extra serialization (MessagePack, CBOR)
[dependencies.rmp-serde]
version = "~1.3"
optional = true

[dependencies.ciborium]
version = "~0.2"
optional = true

[dependencies.md5]
version = "~0.8"
optional = true

[dependencies.base64]
version = "0.22"
optional = false

[dependencies.sha2]
version = "~0.10"
optional = true

# ============================================================================
# DATABASE DEPENDENCIES
# ============================================================================
[dependencies.sea-orm]
version = "2.0.0-rc.37"
default-features = false
features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"]
optional = true

[dependencies.sqlx]
version = "~0.8"
default-features = false
features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate"]
optional = true

# ============================================================================
# OBSERVABILITY & METRICS
# ============================================================================

[dependencies.opentelemetry]
version = "0.31"
optional = true

[dependencies.opentelemetry_sdk]
version = "0.31"
optional = true

[dependencies.tracing-opentelemetry]
version = "0.32"
optional = true

[dependencies.opentelemetry-otlp]
version = "0.31"
optional = true

[dependencies.tracing-subscriber]
version = "~0.3"
default-features = false
features = ["env-filter", "fmt"]
optional = true

# ============================================================================
# UTILITIES
# ============================================================================
[dependencies.tokio-util]
version = "~0.7"
optional = true

[dependencies.futures]
version = "~0.3"
optional = true

[dependencies.arc-swap]
version = "~1.9"

[dependencies.regex]
version = "~1.12"
optional = true

# Chrono - 精简特性
[dependencies.chrono]
version = "~0.4"
default-features = false
features = ["serde", "clock"]
optional = true

# ============================================================================
# ADVANCED FEATURES
# ============================================================================
# Bloom filter for cache optimization
[dependencies.bloomfilter]
version = "3.0"
optional = true

# Murmur3 hash for bloom filters
[dependencies.murmur3]
version = "~0.5"
optional = true

# LRU cache for bloom filter hash cache
[dependencies.lru]
version = "0.18"
optional = true

# Rate Limiting
[dependencies.governor]
version = "0.8"
optional = true

# ============================================================================
# CONFIGURATION
# ============================================================================

# CLI - 精简特性
[dependencies.clap]
version = "4.6"
features = ["derive", "env"]
optional = true

# ============================================================================
# DEV DEPENDENCIES
# ============================================================================
[dev-dependencies]
tempfile = "3.15"
serial_test = "3.4"
rand = "0.10"
criterion = { version = "~0.5", features = ["async_tokio"] }
ctor = "0.2"
mockall = "0.14.0"

# ============================================================================
# TEST DEPENDENCIES
# ============================================================================
[dev-dependencies.testcontainers]
version = "0.23"

[dev-dependencies.testcontainers-modules]
version = "0.11"
features = ["redis"]

[features]

# Default: Full feature set for maximum compatibility
default = ["full"]

# --------------------------------------------------------------------
# TIERED FEATURES (Build on top of individual features)
# --------------------------------------------------------------------

# Minimal: Only L1 memory cache - no Redis, no external services
minimal = [
    "moka",
    "tokio/time",
    "tracing",
    "metrics",
    "serialization",
    "dep:chrono",
]

# Core: L1 + L2 basic functionality (Redis)
core = [
    "minimal",
    "redis",
    "futures",
]

# Full: All features enabled
full = [
    "core",
    "macros",
    "bloom-filter",
    "rate-limiting",
    "wal-recovery",
    "database",
    "sqlite",
    "dashmap",
    "dep:moka",
    "dep:redis",
    "dep:tracing",
    "cli",
    "full-metrics",
    "batch-write",
    "codegen",
    "compression",
    "smart-strategy",
    "redis-native",
    "enhanced-stats",
    "ttl-control",
    "tiered-cache",
    "extra-serialization",
    "http-cache",
    "serialization-cache",
    "lua-script",
    "testing",
    "singleflight",
]

# --------------------------------------------------------------------
# COMPONENT FEATURES
# --------------------------------------------------------------------

# Cache Macros
macros = ["dep:oxcache_macros"]

# L1 Cache Implementation (Moka)
moka = ["dep:moka", "dep:dashmap"]

# DashMap Backend (Pure in-memory concurrent cache)
dashmap-backend = ["dep:dashmap"]

# L2 Cache Implementation (Redis)
redis = ["dep:redis", "dep:regex"]

# Tracing support
tracing = ["dep:tracing"]

# SHA-256 hashing support
sha2 = ["dep:sha2"]

# Serialization Support
serialization = ["dep:serde", "dep:serde_json"]
bincode = ["serialization", "dep:bincode"]
compression = ["dep:flate2"]
flate2 = ["dep:flate2"]

# Serialization Cache
serialization-cache = ["serialization", "dep:dashmap"]

# Metrics & Observability
chrono = ["dep:chrono"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:chrono",
    "dep:tracing",
]
metrics = ["opentelemetry", "dep:dashmap", "dep:tracing"]
full-metrics = ["metrics", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp"]

# Testing support (exposes internal functions for integration tests)
testing = []

# Database Integration
database = ["dep:sea-orm", "dep:sqlx", "dep:regex"]
sqlite = ["database", "sqlx/sqlite"]
dashmap = ["dep:dashmap"]

# Advanced Features
bloom-filter = ["dep:bloomfilter", "dep:murmur3", "dep:lru"]
rate-limiting = ["dep:governor", "dashmap"]
wal-recovery = ["database", "redis"]
batch-write = ["dep:tokio-util"]
sync = []

# Smart Strategy Features
smart-strategy = ["compression", "metrics", "moka"]
redis-native = ["redis"]
enhanced-stats = ["metrics"]
ttl-control = ["redis"]
tiered-cache = ["moka", "redis"]
extra-serialization = ["dep:rmp-serde", "dep:ciborium"]
http-cache = ["serialization", "tiered-cache", "dep:md5", "dep:sha2", "dep:http", "dep:tower", "dep:axum", "dep:hyper", "dep:http-body-util", "dep:glob-match"]

# SingleFlight (cache stampede prevention)
singleflight = ["dep:tokio-util"]

# Lua Script Execution
lua-script = ["redis"]

cli = ["dep:clap", "dep:dashmap", "dep:tracing", "metrics"]
codegen = ["dep:anyhow"] # Used for build scripts

# ============================================================================
# COMPILER OPTIMIZATIONS
# ============================================================================

# Release profile: Maximum performance
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

# Optimize all dependencies equally
[profile.release.package."*"]
opt-level = 3

# Release with debug info: For profiling and debugging release builds
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Dev profile: Fast compilation for development iteration
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Dev optimized: Faster dev builds with some optimizations
[profile.dev-optimized]
inherits = "dev"
opt-level = 2
debug = true

# Test profile
[profile.test]
opt-level = 0
debug = true

# Benchmark profile: Use release optimizations
[profile.bench]
inherits = "release"

# Optimize heavy dependencies even in dev builds
[profile.dev.package.moka]
opt-level = 2

[profile.dev.package.redis]
opt-level = 2

[profile.dev.package.sea-orm]
opt-level = 2

[profile.dev.package.sqlx]
opt-level = 2

[profile.dev.package.serde]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.tokio]
opt-level = 2

# ============================================================================
# BENCHMARKS
# ============================================================================
[[bench]]
name = "modern_api_benchmark"
harness = false

[[bench]]
name = "optimization_benchmark"
harness = false

[[bench]]
name = "redis_benchmark"
harness = false
