authors = ["Kirky-X <Kirky-X@outlook.com>"]
[package]
name = "oxcache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A high-performance multi-level cache library for Rust with L1 (memory) and L2 (Redis) caching."
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cache", "redis", "memory", "async", "performance"]
categories = ["caching", "asynchronous", "database"]

[package.metadata.docs.rs]
features = ["full", "bloom", "kit"]

[lints]
workspace = true

[lib]
name = "oxcache"
path = "src/lib.rs"

# ============================================================================
# WORKSPACE
# ============================================================================
[workspace]
resolver = "2"
members = [".", "macros", "examples"]

[workspace.package]
version = "0.5.0-rc.7"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
repository = "https://github.com/Kirky-X/oxcache"

[workspace.dependencies]
tokio = { version = "1.53", default-features = false }
async-trait = "0.1"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "async_tokio"] }

[workspace.lints.rust]
# docsrs 是 docs.rs 构建注入的自定义 cfg（doc(cfg(...)) 标注用）
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

# ============================================================================
# DEPENDENCIES
# ============================================================================
[dependencies]
# Internal macros
oxcache_macros = { path = "macros", version = "0.5.0-rc.7", optional = true }

# Async Runtime
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "bytes",
] }
async-trait = { version = "0.1", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["std"] }

# Utilities
uuid = { version = "1.27", default-features = false, features = ["std", "v4"] }

# trait-kit integration (optional, feature-gated via `trait-kit`)
# integrations/kit 装饰/包装 CacheBackend（引用 crate::backend），单开须隐含
# memory 基线方可编译（与 degradation/config-confers 同口径）
[dependencies.trait-kit]
version = "0.5.0-rc.7"
optional = true
default-features = false
features = ["async", "lifecycle", "health", "observer", "shutdown", "decorator"]

# inklog 结构化日志桥接（optional，feature-gated via `inklog`；精确钉已发布
# 版本 =0.3.0-rc.5，禁止 caret 自动升级引入端口漂移。注意：inklog rc.5 自身
# 以 registry 依赖引用 oxcache 0.5.0-rc.5，不同 package id 的合法 DAG 而非
# 包级循环；桥接只消费 inklog 类型，两个 oxcache 实例无类型交换）
[dependencies.inklog]
version = "=0.3.0-rc.5"
optional = true
default-features = false

# futures executor for sync health check in async context (trait-kit feature only)
[dependencies.futures]
version = "0.3"
optional = true
default-features = false
features = ["executor"]

# ICU4X internationalization (always enabled)
# 注意：icu 元包将全部子组件声明为非 optional 依赖且不暴露按组件激活特性，
# default（compiled_data + 各组件推荐面）无法细粒度裁剪，保持元包推荐组合
[dependencies.icu]
version = "2.3"

[dependencies.writeable]
version = "0.6"
default-features = false
features = ["alloc"]

# Fluent internationalization message catalog (always enabled)
[dependencies.fluent-bundle]
version = "0.16"
default-features = false

[dependencies.unic-langid]
version = "0.9"
default-features = false

# L1 Cache (Memory)
[dependencies.moka]
version = "0.12"
default-features = false
features = ["future"]
optional = true

[dependencies.dashmap]
version = "6.2"
default-features = false
optional = true

# redb 嵌入式键值存储（磁盘 L3 后端）
[dependencies.redb]
version = "4.3"
optional = true

# L2 Cache (Redis)
[dependencies.redis]
version = "1.7"
default-features = false
features = ["aio", "tokio-comp", "connection-manager", "cluster-async", "sentinel", "script"]
optional = true

# Aerospike (independent protocol, feature-gated)
# 裁 tls：backend 仅 TCP 直连（ClientPolicy 未配置 TLS 栈）
[dependencies.aerospike]
version = "2.2"
default-features = false
features = ["async", "serialization", "rt-tokio"]
optional = true

# Serialization & Compression
[dependencies.serde]
workspace = true
optional = true

[dependencies.serde_json]
workspace = true
features = ["unbounded_depth"]
optional = true

[dependencies.flate2]
version = "1.1"
default-features = false
features = ["rust_backend"]
optional = true

[dependencies.serde_stacker]
version = "0.1"
default-features = false
optional = true

# Observability & Metrics
[dependencies.bloomfilter]
version = "3.0"
default-features = false
features = ["random"]
optional = true

# Lua 注入防护模式均为 ASCII/显式字符类，保留 unicode 面——\s 在
# unicode 关闭时退化为 ASCII 匹配，非 ASCII 空白（如 U+00A0）将绕过防护
[dependencies.regex]
version = "1.13"
default-features = false
features = ["std", "perf", "unicode"]
optional = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["serde", "clock"]
optional = true

# Telemetry (optional tracing facade)
[dependencies.tracing]
version = "0.1"
default-features = false
optional = true

# Value-level encryption (optional, XChaCha20-Poly1305, aligned with confers)
# nonce 由顶层 getrandom::fill 生成，无需 aead 的 getrandom 特性
[dependencies.chacha20poly1305]
version = "0.11"
default-features = false
features = ["alloc"]
optional = true

[dependencies.getrandom]
version = "0.4"
default-features = false
optional = true

# Value integrity (optional, HMAC-SHA256, aligned with confers audit chain)
[dependencies.hmac]
version = "0.13"
default-features = false
optional = true

# oid（DER 编码，PKI 场景）缓存完整性签名不需要
[dependencies.sha2]
version = "0.11"
default-features = false
features = ["alloc"]
optional = true

# Binary serialization formats (optional)
# 不升 3：bincode 项目已停止开发，crates.io 的 3.0.0 为官方刻意发布的
# compile_error 占位（阻止 caret 误升级），最后正式版为 2.x 线 2.0.1
[dependencies.bincode]
version = "2.0"
default-features = false
features = ["std", "serde"]
optional = true

[dependencies.postcard]
version = "1.1"
default-features = false
features = ["use-std"]
optional = true

# Config-driven build (optional, confers watch hot-reload)
[dependencies.confers]
version = "0.6.0-rc.6"
default-features = false
features = ["config-bus"]
optional = true

# Adaptive compression (optional, zstd threshold decorator)
# 只用 stream encode/decode，裁 legacy（旧格式解码）/arrays/zdict_builder（字典训练）
[dependencies.zstd]
version = "0.14"
default-features = false
optional = true

# ============================================================================
# DEV DEPENDENCIES
# ============================================================================
[dev-dependencies]
# 测试实现 EventPublisher（#[async_trait] trait）所需，与主依赖版本一致
async-trait = { version = "0.1", default-features = false }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
serial_test = { version = "4.0", default-features = false, features = ["async"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
criterion.workspace = true
ctor = { version = "1.0", default-features = false, features = ["std", "proc_macro", "priority"] }
trybuild = { version = "1.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
# 序列化格式对照探针（serialization_rkyv_probe）专用，非承诺特性
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

[dev-dependencies.testcontainers]
version = "0.28"
default-features = false
# watchdog：信号退出时回收 managed 容器，兜底门控超时取消 start future 的
# 窄窗口孤儿（容器已创建、ContainerAsync 句柄未 construct 即被 drop）
# 裁 default（ring）：bollard TLS 栈，本地 docker socket 直连不需要
features = ["watchdog"]

# ============================================================================
# FEATURES
# ============================================================================
[features]
# Default: Minimal (L1 memory cache only)
default = ["minimal"]

# Tiered presets
minimal = [
    "memory",
    "metrics",
    "serialization",
    "dep:chrono",
]
core = ["minimal", "redis"]
full = [
    "core",
    "macros",
    "compression",
    "batch",
    "lua",
    "testing",
    "dragonfly",
    "aerospike",
    "lock",
    "offload",
    "disk",
    "stale",
]

# Component features
# memory/redis 开启即编译 backend 与 cache 核心 API，而 Cache<K,V> 的 serde
# 约束与 UnifiedSerializer 是核心面事实依赖，故隐含 serialization
# （与 minimal/disk 预置既有口径一致）
memory = ["dep:moka", "dep:dashmap", "dep:serde", "serialization"]
# 字节权重同步缓存（tokio-free 直连 moka::sync；moka 默认仅启用 future，需显式加 sync）
byte-weight = ["dep:moka", "moka/sync"]
redis = ["dep:redis", "dep:regex", "serialization"]
dragonfly = ["redis"]
aerospike = ["dep:aerospike"]
macros = ["dep:oxcache_macros", "minimal"]
serialization = ["dep:serde", "dep:serde_json", "dep:serde_stacker"]
metrics = ["serialization", "dep:chrono", "dep:dashmap"]
# BatchWriter 缓冲写（包装 Arc<dyn CacheBackend>，引用 crate::backend），
# 单开须隐含 memory 基线方可编译（与 degradation 同口径）
batch = ["memory"]
lua = ["redis"]
test-util = []
# 已弃用别名：改用 `test-util`
testing = ["test-util"]
bloom = ["dep:bloomfilter"]
trait-kit = ["dep:trait-kit", "dep:futures", "memory"]
# 已弃用别名：改用 `trait-kit`
kit = ["trait-kit"]
lock = ["redis"]
redlock = ["lock"]
# 已弃用别名：改用 `redlock`
red-lock = ["redlock"]
# CompressingBackend 装饰任意 CacheBackend（引用 crate::backend 与
# crate::infra 序列化面），单开须隐含 memory 基线方可编译（与 degradation 同口径）
compression = ["dep:flate2", "dep:zstd", "memory"]
telemetry = ["dep:tracing"]
# Offload 后台任务子系统（去重 / 并发上限 / 超时策略）
offload = ["dep:dashmap"]
# redb 嵌入式磁盘持久化 L3 后端（memory 为模块门控基线）
disk = ["memory", "serialization", "dep:redb"]
# SWR 三态过期（依赖 offload 做后台重验证）
stale = ["memory", "offload", "serialization"]
invalidation = ["redis", "serialization", "dep:futures"]
pubsub = ["redis", "dep:futures", "dep:tracing"]
# EncryptedBackend/IntegrityBackend 装饰任意 CacheBackend（引用
# crate::backend；integrity 观测另及 crate::infra metrics），单开须隐含
# memory 基线方可编译（与 degradation 同口径）；integrity 模块寄生在
# encryption 模块内（envelope 签名族），须隐含 encrypt
encrypt = ["dep:chacha20poly1305", "dep:getrandom", "memory"]
integrity = ["encrypt", "dep:hmac", "dep:sha2"]
serde-bincode = ["serialization", "dep:bincode"]
postcard = ["serialization", "dep:postcard"]
config-confers = ["dep:confers", "serialization", "memory", "dep:futures"]
# degradation 装饰 L2 后端,其模块引用 crate::backend(backend 模块门控
# any(memory,redis,disk)),单开须隐含最小 backend 基线方可编译
degradation = ["memory"]
audit = []
# 审计事件 → inklog 结构化日志发布器（TracingAuditPublisher 的落盘直连变体；
# 隐含 audit 端口。inklog 依赖钉已发布 rc.5，所需端口 LogRecord/LogSink 均为
# 该版本无条件编译面）
inklog = ["audit", "dep:inklog", "dep:serde_json"]
versioning = []

# 热 key 采样观测（审计 F11）
hotkey = ["dep:dashmap"]
# 自适应 TTL（R5）：hot 延长 / cold 缩短装饰器，显式常量配置，默认关闭；
# 装饰 crate::backend(backend 模块门控 any(memory,redis,disk)),单开须隐含
# memory 基线方可编译（与 degradation 同口径）
adaptive-ttl = ["dep:dashmap", "memory"]

# 智能预热：WarmupLoader 端口拉热 key 集合异步回填 ChainCache，默认关闭；
# 回填经链式批量读/写 API（操作对象为 crate::cache::ChainCache），单开须
# 隐含 memory 基线方可编译（与 adaptive-ttl 同口径）
warmup = ["memory"]

# ============================================================================
# PROFILES
# ============================================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# ============================================================================
# BENCHMARKS
# ============================================================================
[[bench]]
name = "modern_api_benchmark"
harness = false
required-features = ["minimal"]

[[bench]]
name = "hot_path_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "redis_benchmark"
harness = false
required-features = ["redis"]

[[bench]]
name = "serialization_benchmark"
harness = false
required-features = ["serialization"]

[[bench]]
name = "serialization_rkyv_probe"
harness = false
required-features = ["serialization"]

[[bench]]
name = "metrics_recorder_benchmark"
harness = false
# bench 走 `oxcache::Cache` 热路径（memory 面），单开 metrics 不满足
required-features = ["metrics", "memory"]

[[bench]]
name = "sync_surface_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "dashmap_benchmark"
harness = false
required-features = ["memory"]

[[bench]]
name = "dragonfly_benchmark"
harness = false
required-features = ["dragonfly"]

# Redis 多模式示例（与 oxcache-examples 包共享同一源文件，单源双注册）：
# 主包默认 features 不含 redis，源码内 cfg 据此降级为指引输出，保证
# workspace 根 `cargo run --example example_redis_modes` 可解析运行（rc=0）
[[example]]
name = "example_redis_modes"
path = "examples/src/02_advanced/example_redis_modes.rs"
