# Redis Cluster Node5 配置
# 端口 6379, 集群端口 16379

bind 0.0.0.0
port 6379
daemonize no
appendonly yes

# 集群配置
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-announce-ip 127.0.0.1
cluster-announce-port 7004
cluster-announce-bus-port 17004

# 日志级别
loglevel notice

# 最大内存设置
maxmemory 256mb
maxmemory-policy allkeys-lru
