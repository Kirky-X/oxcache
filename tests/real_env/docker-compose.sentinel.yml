# Redis Sentinel模式测试配置
# 用于真实环境下的高可用性测试
#
# 注意：
# - Sentinel 配置以"只读模板 + 复制到可写卷"方式挂载：redis-sentinel 启动期
#   会重写 sentinel.conf（记录主节点纪元/从节点清单），单文件 bind mount 的
#   inode 归宿主持有，容器内重命名必然 Permission denied 而退出。
# - master 宿主端口默认 16380：16379 与邻项目 confers-test-redis 冲突；
#   可用 REDIS_MASTER_HOST_PORT 覆盖。

services:
  # Redis主节点
  redis-master:
    image: redis:latest
    container_name: redis-master
    ports:
      - "${REDIS_MASTER_HOST_PORT:-16380}:6379"
    volumes:
      - ./configs/redis-master.conf:/usr/local/etc/redis/redis.conf
      - redis-master-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      redis-sentinel:
        ipv4_address: 172.26.0.2
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis从节点1
  redis-slave1:
    image: redis:latest
    container_name: redis-slave1
    ports:
      - "26385:6379"
    volumes:
      - ./configs/redis-slave1.conf:/usr/local/etc/redis/redis.conf
      - redis-slave1-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    depends_on:
      - redis-master
    networks:
      redis-sentinel:
        ipv4_address: 172.26.0.3
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis从节点2
  redis-slave2:
    image: redis:latest
    container_name: redis-slave2
    ports:
      - "26386:6379"
    volumes:
      - ./configs/redis-slave2.conf:/usr/local/etc/redis/redis.conf
      - redis-slave2-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    depends_on:
      - redis-master
    networks:
      redis-sentinel:
        ipv4_address: 172.26.0.4
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sentinel节点1
  redis-sentinel1:
    image: redis:latest
    container_name: redis-sentinel1
    ports:
      - "26382:26379"
    volumes:
      - ./configs/redis-sentinel1.conf:/config-template/sentinel.conf:ro
      - sentinel1-data:/data
    command: sh -c "cp /config-template/sentinel.conf /data/sentinel.conf && exec redis-sentinel /data/sentinel.conf"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    networks:
      redis-sentinel:
        ipv4_address: 172.26.0.10

  # Sentinel节点2
  redis-sentinel2:
    image: redis:latest
    container_name: redis-sentinel2
    ports:
      - "26383:26379"
    volumes:
      - ./configs/redis-sentinel2.conf:/config-template/sentinel.conf:ro
      - sentinel2-data:/data
    command: sh -c "cp /config-template/sentinel.conf /data/sentinel.conf && exec redis-sentinel /data/sentinel.conf"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    networks:
      redis-sentinel:
        ipv4_address: 172.26.0.11

  # Sentinel节点3
  redis-sentinel3:
    image: redis:latest
    container_name: redis-sentinel3
    ports:
      - "26384:26379"
    volumes:
      - ./configs/redis-sentinel3.conf:/config-template/sentinel.conf:ro
      - sentinel3-data:/data
    command: sh -c "cp /config-template/sentinel.conf /data/sentinel.conf && exec redis-sentinel /data/sentinel.conf"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    networks:
      redis-sentinel:
        ipv4_address: 172.26.0.12

networks:
  redis-sentinel:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24

volumes:
  redis-master-data:
  redis-slave1-data:
  redis-slave2-data:
  sentinel1-data:
  sentinel2-data:
  sentinel3-data:
