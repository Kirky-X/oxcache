# Redis Cluster模式测试配置
# 用于真实环境下的分布式测试
#
# 拓扑说明：单容器跑 6 个 redis-server 节点（3 主 3 从），全部以
# cluster-announce-ip 127.0.0.1 对外宣告——容器内节点互连与宿主机
# 客户端（redis-rs ClusterClient 按 CLUSTER SLOTS/MOVED 返回的地址
# 直连）解析到同一组 127.0.0.1:7000-7005，经端口发布天然可达。
# 勿改回多容器桥接网络拓扑：节点会宣告容器内网地址（172.21.0.x），
# 宿主机 ClusterClient 无法直连，库级集群用例只能整批超时。

services:
  redis-cluster:
    image: redis:7-alpine
    container_name: redis-cluster
    ports:
      - "7000:7000"
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
      - "7004:7004"
      - "7005:7005"
    volumes:
      - redis-cluster-data:/data
    command: |
      sh -c '
        rm -f /data/nodes-*.conf
        for port in 7000 7001 7002 7003 7004 7005; do
          redis-server --bind 0.0.0.0 --protected-mode no \
            --port $$port --dir /data \
            --cluster-enabled yes \
            --cluster-config-file /data/nodes-$$port.conf \
            --cluster-announce-ip 127.0.0.1 \
            --cluster-announce-port $$port \
            --cluster-announce-bus-port $$((port + 10000)) \
            --save "" --appendonly no &
        done

        echo "等待 6 个节点就绪..."
        for i in $$(seq 1 60); do
          ready=1
          for port in 7000 7001 7002 7003 7004 7005; do
            redis-cli -p $$port ping 2>/dev/null | grep -q PONG || ready=0
          done
          [ $$ready -eq 1 ] && break
          sleep 1
        done

        echo "创建 Redis Cluster（3 主 3 从）..."
        redis-cli --cluster create \
          127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
          127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
          --cluster-replicas 1 --cluster-yes

        if redis-cli -p 7000 cluster info | grep -q "cluster_state:ok"; then
          echo "集群就绪：cluster_state ok"
          exec tail -f /dev/null
        else
          echo "集群创建失败，退出以显性暴露" >&2
          exit 1
        fi
      '
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -p 7000 cluster info | grep -q cluster_state:ok" ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis-cluster-data:
