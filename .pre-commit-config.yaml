# Oxcache Pre-commit Hooks Configuration
# ======================================

repos:
  # Rust Toolchain Hooks
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: Rust Format
        description: Check Rust code formatting with cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: fmt-fix
        name: Rust Format Fix
        description: Auto-fix Rust code formatting issues
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: clippy
        name: Rust Clippy
        description: Run cargo clippy for static code analysis
        entry: bash scripts/precommit_clippy.sh
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

      - id: test-fast
        name: Rust Fast Tests
        description: Run fast unit tests (skip slow integration tests)
        entry: bash scripts/precommit_tests.sh
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

  # Security Audit Hooks
  - repo: https://github.com/crazy-max/ghaction-deny
    rev: v1.0.0
    hooks:
      - id: deny-check
        name: Cargo Dependency Audit
        description: Check for security vulnerabilities using cargo-deny
        entry: bash scripts/precommit_deny.sh
        language: system
        types: [rust, toml]
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: cargo-audit
        name: Cargo Audit (Enhanced)
        description: Enhanced vulnerability scanning with RUSTSEC database
        entry: bash scripts/precommit_audit.sh
        language: system
        types: [rust, toml]
        pass_filenames: false
        stages: [pre-commit]

      - id: license-check
        name: License Compliance
        description: Check for license issues in dependencies
        entry: bash scripts/precommit_license.sh
        language: system
        types: [rust, toml]
        pass_filenames: false
        stages: [pre-commit]

  # Secret Scanning Hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-secrets
        name: Detect Secrets
        description: Detect accidental secret/key exposure
        entry: bash scripts/precommit_secrets.sh
        language: system
        types: [text]
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

      - id: check-added-large-files
        name: Check Large Files
        description: Prevent accidental large file commits
        entry: git check-added-large-files --maxkb=1024
        language: system
        types: [text]
        pass_filenames: false
        stages: [pre-commit]

  # Configuration Validation
  - repo: local
    hooks:
      - id: toml-validate
        name: TOML Validation
        description: Validate Cargo.toml and config files
        entry: bash scripts/precommit_toml.sh
        language: system
        types: [toml]
        pass_filenames: false
        stages: [pre-commit]

# Global Settings
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
verbose: true
require_serial: false
exclude: |
  (?x)^(
    target/|
    Cargo\.lock|
    \.git/|
    \.idea/|
    \.vscode/
  )
print_fixed_on_failure: false
fail_fast: false
