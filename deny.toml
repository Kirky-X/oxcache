# cargo-deny 配置文件
# 文档: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RUSTSEC-2023-0071: rsa 漏洞来自 sqlx 的传递依赖，无可用修复版本
    "RUSTSEC-2023-0071",
    # RUSTSEC-2025-0111: tokio-tar 漏洞来自 testcontainers 的传递依赖，无可用修复版本
    "RUSTSEC-2025-0111",
    # RUSTSEC-2025-0141: bincode 未维护警告，项目直接依赖
    "RUSTSEC-2025-0141",
    # RUSTSEC-2025-0134: rustls-pemfile 未维护警告，来自 bollard 传递依赖
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",  # MIT No Attribution - OSI批准
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",  # Boost Software License 1.0 - OSI批准, xxhash-rust使用
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
