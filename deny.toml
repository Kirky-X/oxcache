# cargo-deny 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# `cargo deny check` 校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/
# 仓库特有豁免写在 [advisories].ignore 与 [[licenses.exceptions]],须附原因注释。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# 按仓库填:传递依赖 RUSTSEC 豁免(每项须注释原因)

[licenses]
# 允许的宽松许可证;新增非宽松许可证需在此放行
# 注:下列条目为本仓依赖树实际命中的集合(未命中项已按 unused-allowed-license 移除)
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"
# 7 仓统一 license：MIT + Commons Clause v1.0（license-file 形态，见 base/CONFIG_BASELINE.md）。
# cargo-deny 不识别 manifest 的 license-file 且 allow 不接受 LicenseRef-*，
# 对本地工作区 crate 用 clarify 绑定 LICENSE 文件内容 hash（防篡改）并按文件内
# MIT 主文识别放行；Commons Clause 商用限制由 LICENSE 文件本身承载

[[licenses.clarify]]
name = "oxcache"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xfb13e7ad }]
[[licenses.clarify]]
name = "oxcache_macros"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xfb13e7ad }]
[[licenses.clarify]]
name = "trait-kit"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xfb13e7ad }]

# 传递依赖许可证例外
[[licenses.exceptions]]
# rhexdump 是 aerospike-core 的传递依赖，GPL-3.0-or-later 为 copyleft 许可证
# 不能加入全局 allow，仅对此 crate 例外
allow = ["GPL-3.0-or-later"]
crate = "rhexdump"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 传递依赖树版本分裂豁免(aerospike→pwhash 旧加密栈、trybuild→syn 2 等第三方内部分裂,
# 无法在 manifest 层收敛;skip 旧版本条目,保留最新):
skip = [
    { name = "block-buffer", version = "0.9.0" },   # pwhash 旧栈 vs digest 0.11 链
    { name = "digest", version = "0.9.0" },         # pwhash 旧栈 vs ripemd 链
    { name = "cpufeatures", version = "0.2.17" },   # getrandom/sha 旧链
    { name = "getrandom", version = "0.2.17" },     # rand 0.8 链(pwhash)
    { name = "rand", version = "0.8.8" },           # pwhash 旧链 vs rand 0.10
    { name = "rand_core", version = "0.6.4" },      # rand 0.8 链(pwhash)
    { name = "syn", version = "2.0.119" },          # trybuild 旧链 vs oxcache_macros syn 3
    { name = "windows-sys", version = "0.52.0" },   # 旧传递链 vs 0.61
]
skip-tree = []

[[bans.deny]]
name = "serde_yaml" # deprecated, use serde_yaml_ng
wrappers = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
