[package]
name = "oxcache_macros"
version.workspace = true
edition.workspace = true
description = "Procedural macros for oxcache"
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
# 精简 syn 特性，避免引入不必要的依赖
syn = { version = "3.0", features = ["full", "extra-traits", "parsing", "proc-macro"] }
quote = "1.0"
proc-macro2 = "1.0"
