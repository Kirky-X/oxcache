[package]
name = "oxcache_macros"
version = "0.3.1"
edition = "2021"
description = "Procedural macros for oxcache"
license = "MIT"
repository = "https://github.com/kirky-x/oxcache"

[lib]
proc-macro = true

[dependencies]
# 精简 syn 特性，避免引入不必要的依赖
syn = { version = "2.0", features = ["full", "extra-traits", "parsing", "proc-macro"] }
quote = "1.0"
proc-macro2 = "1.0"
