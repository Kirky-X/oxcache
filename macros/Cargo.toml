[package]
name = "oxcache_macros"
version = "0.2.0"
edition = "2021"
description = "Procedural macros for oxcache"
license = "MIT"
repository = "https://github.com/kirky-x/oxcache"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
