# lefthook 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# 启用: lefthook install(或 bash scripts/install-pre-commit.sh)
# 与 .pre-commit-config.yaml 功能等价,二选一即可。
pre-commit:
  parallel: true
  commands:
    rustfmt-check:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      # 零告警门槛 feature 组合:--all-features(全 feature 组合为合法组合)
      run: cargo clippy --all-targets --all-features -- -D warnings
    cargo-deny:
      run: cargo deny check
    no-private-key:
      run: "! git diff --cached --name-only | xargs -r grep -IlE 'BEGIN (RSA|OPENSSH|PGP|EC|PRIVATE) PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'grep -qE "^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert|style)(\(.+\))?!?: .+" {1}'

pre-push:
  commands:
    cargo-audit:
      run: cargo audit
    coverage-80:
      name: coverage ≥80% lines
      run: cargo llvm-cov --fail-under-lines 80
