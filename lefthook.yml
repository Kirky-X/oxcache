# lefthook 配置 — 7 仓库统一基线（与 .pre-commit-config.yaml 二选一启用）
# 启用: lefthook install
# 分工: 本文件负责提交期编译门禁（fmt/clippy/deny/私钥）与推送期 audit/覆盖率；
# 空白字符/YAML/TOML/typos/基线密钥扫描由 .pre-commit-config.yaml 覆盖
pre-commit:
  parallel: true
  commands:
    rustfmt-check:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      # 零告警门槛 feature 组合：全 feature 组合为合法组合（与 CI clippy job 一致）
      run: cargo clippy --all-targets --all-features -- -D warnings
    cargo-deny:
      run: cargo deny check
    no-private-key:
      run: "! git diff --cached --name-only | xargs -r grep -IlE 'BEGIN (RSA|OPENSSH|PGP|EC|PRIVATE) PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'grep -qE "^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert|style)(\(.+\))?!?: .+" {1}'

pre-push:
  commands:
    cargo-audit:
      run: cargo audit
    coverage-90:
      name: coverage ≥90% lines
      run: cargo llvm-cov --fail-under-lines 90
