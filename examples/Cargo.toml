[package]
name = "oxcache-examples"
version = "0.1.0"
edition = "2021"
description = "Oxcache Examples - A collection of examples demonstrating how to use the oxcache two-level caching library"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/kirky-x/oxcache"
readme = "README.md"
keywords = ["cache", "redis", "examples", "tutorial"]
categories = ["caching", "asynchronous", "educational"]

[dependencies]
# Path dependency to the main oxcache project
oxcache = { path = "..", default-features = false, features = [
    "full",
    "l1-moka",
    "l2-redis",
    "serialization",
    "bincode",
    "compression",
    "bloom-filter",
    "rate-limiting",
    "wal-recovery",
    "database",
    "cli",
    "full-metrics",
    "batch-write",
    "config-toml",
] }

# Async runtime
tokio = { version = "1.32", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
rand = "0.8"
tempfile = "3.8"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
secrecy = { version = "0.8", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[example]]
name = "example_basic_operations"
path = "examples/01_basics/example_basic_operations.rs"

[[example]]
name = "example_comprehensive_usage"
