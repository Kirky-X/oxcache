[package]
name = "oxcache-examples"
version.workspace = true
edition.workspace = true
description = "Oxcache Examples - A collection of examples demonstrating how to use the oxcache two-level caching library"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cache", "redis", "examples", "tutorial"]
categories = ["caching", "asynchronous", "educational"]
publish = false

[dependencies]
# Path dependency to the main oxcache project
oxcache = { path = "..", default-features = false, features = [
    "full",
    "bloom",
    "kit",
] }

# Tracing for logging (minimal features)
# `tracing` is required directly because the `#[cached]` macro expands to
# `::tracing::warn!(...)` calls in user code (examples crate), not just inside
# the oxcache crate itself.
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

# Utilities needed by examples
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
chrono = { workspace = true, features = ["serde"] }
async-trait.workspace = true
trait-kit = { version = "0.4", features = ["async", "observer", "shutdown", "decorator"] }

[dev-dependencies]
criterion.workspace = true

