[package]
name = "oxcache-examples"
version = "0.1.0"
edition = "2021"
description = "Oxcache Examples - A collection of examples demonstrating how to use the oxcache two-level caching library"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/kirky-x/oxcache"
readme = "README.md"
keywords = ["cache", "redis", "examples", "tutorial"]
categories = ["caching", "asynchronous", "educational"]

[dependencies]
# Path dependency to the main oxcache project
oxcache = { path = "..", default-features = false, features = [
    "full",
    "moka",
    "redis",
    "serialization",
    "compression",
    "bloom-filter",
    "rate-limiting",
    "wal-recovery",
    "database",
    "cli",
    "full-metrics",
    "batch-write",
    "confers",
    "smart-strategy",
    "http-cache",
    "config-dynamic",
    "extra-serialization",
] }

# Async runtime
tokio = { version = "1.50", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
rand = "0.8"
tempfile = "3.27"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
secrecy = { version = "0.8", features = ["serde"] }
axum = { version = "0.7", optional = true, default-features = false, features = ["tokio"] }
http = { version = "1.0", optional = true }

[features]
default = []
http-cache = ["oxcache/http-cache", "axum", "http"]
redis = []

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[example]]
name = "example_basic_operations"
path = "src/01_basics/example_basic_operations.rs"

[[example]]
name = "example_comprehensive_usage"
path = "src/01_basics/example_comprehensive_usage.rs"

[[example]]
name = "example_serialization"
path = "src/01_basics/example_serialization.rs"

[[example]]
name = "example_batch_write"
path = "src/02_advanced/example_batch_write.rs"

[[example]]
name = "example_cache_promotion"
path = "src/02_advanced/example_cache_promotion.rs"

[[example]]
name = "example_invalidation"
path = "src/02_advanced/example_invalidation.rs"

[[example]]
name = "example_warmup"
path = "src/02_advanced/example_warmup.rs"

[[example]]
name = "example_chain_cache"
path = "src/02_advanced/example_chain_cache.rs"

# 新功能示例
[[example]]
name = "example_new_api"
path = "src/01_basics/example_new_api.rs"

[[example]]
name = "example_smart_strategy"
path = "src/02_advanced/example_smart_strategy.rs"

[[example]]
name = "example_redis_native"
path = "src/02_advanced/example_redis_native.rs"

[[example]]
name = "example_http_cache"
path = "src/04_http/example_http_cache.rs"
required-features = ["http-cache"]

[[example]]
name = "example_dynamic_config"
path = "src/03_config/example_dynamic_config.rs"

[[example]]
name = "example_cached_macro"
path = "src/01_basics/example_cached_macro.rs"

[[example]]
name = "example_unified_config_memory"
path = "src/01_basics/example_unified_config_memory.rs"

[[example]]
name = "example_unified_config_tiered"
path = "src/01_basics/example_unified_config_tiered.rs"

[[example]]
name = "example_bloom_filter"
path = "src/06_features/example_bloom_filter.rs"

[[example]]
name = "example_rate_limiting"
path = "src/06_features/example_rate_limiting.rs"

[[example]]
name = "example_database_integration"
path = "src/05_database/example_database_integration.rs"

[[example]]
name = "example_cli_usage"
path = "src/06_features/example_cli_usage.rs"

[[example]]
name = "example_events"
path = "src/06_features/example_events.rs"

[[example]]
name = "example_security"
path = "src/06_features/example_security.rs"

[profile.release]
opt-level = 1
