[package]
name = "oxcache-example-minimal-feature"
version = "0.1.0"
edition = "2021"
description = "Example demonstrating oxcache with minimal feature set (L1 memory cache only)"
license = "MIT"
publish = false

[dependencies]
# Use minimal feature only — no redis, no opentelemetry-otlp, no compression, no cli.
# This simulates the narrowest supported user scenario: L1 memory cache + metrics.
oxcache = { path = "../../../", default-features = false, features = ["minimal"] }

tokio = { version = "~1.52", default-features = false, features = ["rt", "macros", "rt-multi-thread"] }

[[bin]]
name = "minimal_feature_example"
path = "src/main.rs"
