name: Security and Dependency Check

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每周一早上6点运行安全检查
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: |
          echo "🔍 Running security audit..."
          cargo audit --deny warnings
        continue-on-error: false

  dependency-check:
    name: Dependency License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Check dependencies
        run: |
          echo "🔍 Checking dependency licenses and bans..."
          cargo deny check --all-features
        continue-on-error: false

  outdated-check:
    name: Outdated Dependencies Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check for outdated dependencies
        run: |
          echo "🔍 Checking for outdated dependencies..."
          cargo outdated --root-deps-only --exit-code 1
        continue-on-error: true

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-audit, dependency-check]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        run: |
          cargo install cargo-audit
          cargo install cargo-deny

      - name: Generate comprehensive report
        run: |
          echo "📊 Security and Dependency Report"
          echo "=================================="
          echo ""

          echo "## Security Audit Results"
          cargo audit 2>&1 || true

          echo ""
          echo "## License Check Results"
          cargo deny check licenses 2>&1 || true

          echo ""
          echo "## Dependency Tree"
          cargo tree --depth 1 2>&1 || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            Cargo.lock
            deny.toml
          retention-days: 30

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [security-audit, dependency-check]
    if: failure()
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Security Check Failed';
            const body = `
            ## Security Check Failure

            The automated security check has detected issues that need attention.

            **Triggered by:** \`${{ github.event_name }}\`
            **Branch:** \`${{ github.ref }}\`
            **Commit:** \`${{ github.sha }}\`

            ### Action Required

            Please review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            ### Checklist
            - [ ] Review security audit results
            - [ ] Update vulnerable dependencies
            - [ ] Update deny.toml if needed
            - [ ] Document reasoning for any ignored advisories

            ---
            *This issue was automatically created by the security check workflow.*
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'automated']
            });
