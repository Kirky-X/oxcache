name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Verify build (full features)
        run: cargo build --release --features full --workspace
      - name: Verify tests pass
        run: cargo test --features full --workspace --no-fail-fast
        env:
          OXCACHE_TEST_STRICT: "1"

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest
      - name: Derive prerelease flag
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release uniqueness (idempotency guard)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io (conditional)
    needs: github-release
    runs-on: ubuntu-latest
    # crates.io trusted publishing（OIDC）：id-token: write 必需，
    # auth-action 以 Actions OIDC 换取短时凭证，长生命周期令牌退役
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        if: env.HAS_TOKEN == 'true'
        with:
          toolchain: 1.97.1

      - name: Get version from tag
        id: version
        if: env.HAS_TOKEN == 'true'
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if oxcache_macros already published
        id: check_macros
        if: env.HAS_TOKEN == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: oxcache-ci" \
            "https://crates.io/api/v1/crates/oxcache_macros/${{ steps.version.outputs.version }}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "oxcache_macros ${{ steps.version.outputs.version }} already on crates.io, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if oxcache already published
        id: check_main
        if: env.HAS_TOKEN == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: oxcache-ci" \
            "https://crates.io/api/v1/crates/oxcache/${{ steps.version.outputs.version }}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "oxcache ${{ steps.version.outputs.version }} already on crates.io, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish oxcache_macros
        if: env.HAS_TOKEN == 'true' && steps.check_macros.outputs.skip != 'true'
        working-directory: macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: Wait for oxcache_macros on crates.io
        if: env.HAS_TOKEN == 'true' && steps.check_macros.outputs.skip != 'true'
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: oxcache-ci" \
              "https://crates.io/api/v1/crates/oxcache_macros/${{ steps.version.outputs.version }}")
            echo "try${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::oxcache_macros ${{ steps.version.outputs.version }} 未在 crates.io 可见"
          exit 1

      - name: Publish oxcache
        if: env.HAS_TOKEN == 'true' && steps.check_main.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --features full
