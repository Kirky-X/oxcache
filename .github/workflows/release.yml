name: Release

"on":
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify build (full features)
        run: cargo build --release --features full --workspace

      - name: Verify tests pass
        run: cargo test --features full --workspace --no-fail-fast

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io (conditional)
    needs: github-release
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: env.HAS_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_TOKEN == 'true'

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if oxcache_macros already published
        id: check_macros
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: oxcache-ci" \
            "https://crates.io/api/v1/crates/oxcache_macros/${{ steps.version.outputs.version }}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "oxcache_macros ${{ steps.version.outputs.version }} already on crates.io, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if oxcache already published
        id: check_main
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: oxcache-ci" \
            "https://crates.io/api/v1/crates/oxcache/${{ steps.version.outputs.version }}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "oxcache ${{ steps.version.outputs.version }} already on crates.io, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish oxcache_macros
        if: env.HAS_TOKEN == 'true' && steps.check_macros.outputs.skip != 'true'
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --manifest-path macros/Cargo.toml

      - name: Publish oxcache
        if: env.HAS_TOKEN == 'true' && steps.check_main.outputs.skip != 'true'
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --features full
